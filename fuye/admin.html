<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>经验路径管理后台 | Kevin 彭峥</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232D2926'/><text x='50' y='72' text-anchor='middle' font-size='56' font-weight='bold' fill='white' font-family='system-ui'>K</text></svg>" />
  <style>
    :root {
      --bg: #f7f2ea;
      --card: #fffaf2;
      --text: #1e1a17;
      --muted: #6f665d;
      --line: #e4d8c9;
      --primary: #1e1a17;
      --accent: #b8874a;
      --accent-dark: #875f32;
      --green: #2d6a4f;
      --red: #c0392b;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.6;
    }
    h1 { font-size: 28px; letter-spacing: 0; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    /* Login */
    .login-wrap {
      max-width: 400px; margin: 80px auto;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 32px; text-align: center;
    }
    .login-wrap input {
      width: 100%; padding: 14px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 16px; margin: 16px 0;
      font-family: inherit;
    }
    .login-wrap button {
      width: 100%; padding: 14px; background: var(--primary);
      color: #fff; border: 0; border-radius: 10px;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }

    /* Stats */
    .stats {
      display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px 24px; min-width: 130px; flex: 1;
    }
    .stat-card .num { font-size: 36px; font-weight: 900; letter-spacing: 0; }
    .stat-card .label { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .stat-a .num { color: var(--accent-dark); }
    .stat-b .num { color: var(--green); }
    .stat-c .num { color: #6b4c9a; }
    .stat-r .num { color: #2F6F73; }
    .funnel-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin: -8px 0 22px;
      box-shadow: 0 12px 30px rgba(53,40,25,.05);
    }
    .funnel-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .funnel-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0;
    }
    .funnel-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      max-width: 620px;
    }
    .funnel-steps {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
    }
    .funnel-step {
      border: 1px solid rgba(0,0,0,.05);
      border-radius: 14px;
      background: rgba(255,255,255,.54);
      padding: 12px;
    }
    .funnel-step strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      color: var(--text);
      margin-bottom: 6px;
    }
    .funnel-step span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .funnel-rate {
      margin-top: 9px;
      height: 7px;
      border-radius: 999px;
      background: rgba(85,98,79,.12);
      overflow: hidden;
    }
    .funnel-rate i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--accent));
    }
    .ops-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin: -8px 0 22px;
    }
    .ops-card {
      min-height: 128px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 250, 242, 0.82);
      box-shadow: 0 14px 34px rgba(53,40,25,.055);
    }
    .ops-card button {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .ops-num {
      display: block;
      font-size: 28px;
      line-height: 1;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 8px;
    }
    .ops-title {
      display: block;
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .ops-note {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .search-insights {
      display: grid;
      grid-template-columns: 1.05fr 1fr 1fr;
      gap: 12px;
      margin: -8px 0 22px;
    }
    .search-insight-card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 250, 242, 0.84);
      box-shadow: 0 12px 30px rgba(53,40,25,.045);
    }
    .search-insight-card h2 { font-size: 16px; margin-bottom: 4px; }
    .search-insight-card > p { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
    .search-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .search-kpi { padding: 12px; border-radius: 12px; background: rgba(85,98,79,.07); }
    .search-kpi strong { display: block; font-size: 24px; line-height: 1.1; }
    .search-kpi span { display: block; color: var(--muted); font-size: 11px; margin-top: 5px; }
    .search-rank { display: grid; gap: 7px; }
    .search-rank div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 12px; }
    .search-rank span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .search-rank strong { color: var(--text); }

    /* Search */
    .search-bar {
      display: flex; gap: 8px; margin-bottom: 16px; align-items: center;
    }
    .search-bar input {
      flex: 1; padding: 10px 14px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 14px; font-family: inherit;
      background: var(--card);
    }
    .search-bar input:focus { outline: none; border-color: var(--accent); }
    .search-bar button {
      padding: 10px 16px; background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; cursor: pointer; font-size: 13px; font-family: inherit;
    }
    .search-result-note {
      display: none;
      margin: -8px 0 18px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 252, 245, 0.86);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .search-result-note strong {
      color: var(--green);
      font-size: 16px;
      margin: 0 2px;
    }
    body.admin-searching .stats,
    body.admin-searching .funnel-card,
    body.admin-searching .search-insights,
    body.admin-searching .ops-board {
      display: none;
    }
    body.admin-searching .refresh {
      margin-top: 8px;
    }
    body.admin-searching .search-result-note {
      display: block;
    }

    /* Table */
    .tbl-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--card);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 0;
      overflow: hidden;
      font-size: 14px;
    }
    th {
      background: var(--primary); color: #fff; padding: 12px 10px;
      text-align: left; font-weight: 700; white-space: nowrap;
    }
    td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:hover td { background: #fffbf3; }
    tr:last-child td { border-bottom: 0; }

    .tag {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
    }
    .tag-A { background: #efe4d3; color: var(--accent-dark); }
    .tag-B { background: #d4edda; color: var(--green); }
    .tag-C { background: #e8dff5; color: #6b4c9a; }
    .tag-R { background: #cce9ec; color: #2F6F73; }
    .tag-paid { background: #d4edda; color: var(--green); }
    .tag-unpaid { background: #fde8e8; color: var(--red); }
    .tag-pos { background: #fff3cd; color: #856404; }
    .tag-boot { background: #cce5ff; color: #004085; }
    .tag-acq { background: #e8dff5; color: #6b4c9a; }
    .tag-consult { background: #fde8e8; color: var(--red); }
    .tag-extraction { background: #d4edda; color: var(--green); }
    .purchases-select {
      width: 100%;
      max-width: 180px;
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
      font-size: 13px; font-family: inherit; background: var(--card);
    }
    .stat-pos .num { color: #856404; }
    .stat-boot .num { color: #004085; }
    .stat-acq .num { color: #6b4c9a; }
    .tag-src { background: #f0f0f0; color: #555; }
    .tag-tag { background: #e0f0ff; color: #1a6fb5; }
    .signal-stack { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; max-width: 260px; }
    .tag-signal { background: #fff3cd; color: #875f32; }
    .tag-signal-hot { background: #fde8e8; color: var(--red); }
    .tag-signal-done { background: #d4edda; color: var(--green); }
    .tag-priority-high { background: #8b2635; color: #fff; }
    .tag-priority-mid { background: #fff3cd; color: #875f32; }
    .tag-priority-low { background: #e8edf3; color: #405060; }
    .event-timeline {
      margin: 14px 0 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.42);
      overflow: hidden;
    }
    .event-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .event-row:last-child { border-bottom: 0; }
    .event-time { color: var(--muted); }
    .event-name { font-weight: 800; color: var(--text); }
    .edit-notes { width: 100%; max-width: 180px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; font-family: inherit; background:#fffdf8; }
    .edit-notes:focus { outline: none; border-color: var(--accent); }

    .btn-sm {
      min-height: 34px;
      padding: 7px 12px; border: 0; border-radius: 9px;
      cursor: pointer; font-size: 12px; font-weight: 800; white-space: nowrap;
    }
    .btn-copy { background: var(--accent); color: #fff; }
    .btn-view { background: var(--primary); color: #fff; }
    .btn-paid { background: var(--green); color: #fff; }
    .btn-unpaid { background: var(--muted); color: #fff; }
    .btn-sm:hover { opacity: 0.85; }

    .edit-wechat {
      width: 132px; padding: 7px 9px; border: 1px solid var(--line);
      border-radius: 9px; font-size: 13px; font-family: inherit; background:#fffdf8;
    }
    .edit-wechat:focus { outline: none; border-color: var(--accent); }

    .lead-check { width: 42px; text-align: center; }
    .lead-main-cell { min-width: 340px; max-width: 460px; }
    .lead-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .lead-type {
      font-size: 15px;
      font-weight: 900;
      color: var(--text);
    }
    .lead-id {
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .lead-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .lead-meta span {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid rgba(228,216,201,.82);
      border-radius: 999px;
      background: rgba(255,255,255,.58);
    }
    .lead-contact {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .lead-nickname {
      max-width: 180px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lead-diagnostic {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid rgba(184,138,90,.22);
      border-radius: 14px;
      background: rgba(255,255,255,.58);
      display: grid;
      gap: 8px;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }
    .lead-diagnostic-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .lead-diagnostic-title {
      font-size: 13px;
      font-weight: 900;
      color: var(--text);
    }
    .lead-diagnostic-action {
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      background: var(--accent);
      border-radius: 999px;
      padding: 4px 9px;
    }
    .lead-diagnostic-grid {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 6px 10px;
      font-size: 12px;
      line-height: 1.55;
      min-width: 0;
    }
    .lead-diagnostic-grid strong { color: var(--accent); white-space: nowrap; }
    .lead-diagnostic-grid span {
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .deal-cell { min-width: 220px; }
    .deal-pay {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .product-current {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }
    .notes-cell { min-width: 170px; }
    .action-cell { min-width: 142px; }
    .action-stack {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      max-width: 132px;
    }

    @media (max-width: 900px) {
      body { padding: 16px; }
      table { min-width: 900px; }
      .lead-main-cell { min-width: 300px; }
      .ops-board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translateX(-50%);
      background: rgba(31, 26, 23, .94);
      color: #fff; padding: 10px 20px;
      border-radius: 999px;
      opacity: 0; transition: .2s ease; z-index: 200;
      font-size: 14px;
    }
    .toast.show { opacity: 1; }

    .refresh {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .refresh button {
      padding: 8px 18px; background: var(--card); border: 1px solid var(--line);
      border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit;
    }
    .sort-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .sort-control select {
      padding: 8px 30px 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font: inherit;
    }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .loading { text-align: center; padding: 40px; color: var(--muted); }

    /* Answers Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(30, 26, 23, 0.5); z-index: 300;
      justify-content: center; align-items: flex-start; padding: 40px 16px;
      overflow-y: auto;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 32px; max-width: 780px; width: 100%;
      max-height: calc(100dvh - 80px); overflow-y: auto;
      box-shadow: 0 24px 64px rgba(30, 26, 23, 0.15);
    }
    .modal h2 { font-size: 22px; margin-bottom: 4px; letter-spacing: 0; }
    .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .modal .q-block {
      padding: 14px 0; border-bottom: 1px solid var(--line);
    }
    .modal .q-block:last-child { border-bottom: 0; }
    .modal .q-num {
      font-size: 12px; font-weight: 900; color: var(--accent);
      margin-bottom: 4px; letter-spacing: 0.04em;
    }
    .modal .q-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .modal .q-answer {
      display: inline-block; padding: 4px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 700;
      background: #efe4d3; color: var(--accent-dark);
    }
    .modal .q-answer-detail { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .modal .q-na {
      font-size: 13px; color: #c0392b; font-style: italic;
    }
    .modal-close {
      float: right; background: none; border: 0; font-size: 24px;
      cursor: pointer; color: var(--muted); line-height: 1;
    }
    .modal .result-badge {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      font-size: 14px; font-weight: 900; margin-bottom: 16px;
    }
    .btn-answers { background: #6b4c9a; color: #fff; }
    .btn-v3 { background: #2f6f73; color: #fff; }
    .v3-chain-status {
      border-color: rgba(47, 111, 115, 0.28) !important;
      background: rgba(47, 111, 115, 0.08) !important;
      color: #24585b !important;
      font-weight: 800 !important;
    }
    .v3-chain-status.v3-chain-none {
      border-color: rgba(126, 117, 106, 0.22) !important;
      background: rgba(126, 117, 106, 0.07) !important;
      color: #71685e !important;
    }
    .v3-chain-status.v3-chain-working {
      border-color: rgba(176, 138, 90, 0.28) !important;
      background: rgba(176, 138, 90, 0.10) !important;
      color: #7a5728 !important;
    }
    .v3-chain-status.v3-chain-error {
      border-color: rgba(154, 40, 56, 0.28) !important;
      background: rgba(154, 40, 56, 0.08) !important;
      color: #8b2434 !important;
    }
    .v3-review-guidance {
      margin: 14px 0 4px;
      padding: 16px;
      border: 1px solid rgba(47, 111, 115, 0.24);
      border-radius: 14px;
      background: rgba(47, 111, 115, 0.06);
    }
    .v3-review-guidance[data-level="high"] {
      border-color: rgba(154, 40, 56, 0.28);
      background: rgba(154, 40, 56, 0.06);
    }
    .v3-review-guidance[data-level="low"] {
      border-color: rgba(45, 106, 79, 0.28);
      background: rgba(45, 106, 79, 0.06);
    }
    .v3-review-recommendation {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 999px;
      background: #2f6f73;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
    }
    .v3-review-guidance[data-level="high"] .v3-review-recommendation { background: #8b2635; }
    .v3-review-guidance[data-level="low"] .v3-review-recommendation { background: #2d6a4f; }
    .v3-review-checks {
      display: grid;
      gap: 10px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }
    .v3-review-checks li {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.68);
      font-size: 13px;
      line-height: 1.65;
    }
    .v3-review-checks strong { display: block; color: var(--text); }
    .v3-review-details {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .v3-review-details > summary {
      padding: 13px 15px;
      cursor: pointer;
      color: var(--accent-dark);
      font-size: 14px;
      font-weight: 800;
      background: rgba(184, 135, 74, 0.06);
    }
    .v3-review-details-inner { padding: 0 15px 4px; }
    .btn-del { background: var(--red); color: #fff; }
    .btn-undo { background: var(--accent); color: #fff; }
    tr.row-deleting { opacity: 0.5; background: #fde8e8; }
    tr.row-restoring { opacity: 0.7; background: #e8f5e9; }
    .trash-toggle {
      display: inline-block; padding: 8px 14px;
      background: rgba(192,57,43,0.08); color: var(--red);
      border: 1px dashed var(--red); border-radius: 8px;
      font-size: 13px; cursor: pointer; margin-left: 8px;
    }
    .trash-toggle:hover { background: rgba(192,57,43,0.15); }
    .trash-toggle .count { font-weight: 900; }
        .batch-bar {
      display: none; align-items: center; gap: 10px;
      padding: 10px 16px; margin-bottom: 14px;

<script src="/assets/assessment-v3/admin-review.js?v=20260724"></script>
<script>
  function isV3AdminEnabled(locationLike) {
    var value = locationLike || {};
    var hostname = String(value.hostname || '').toLowerCase().replace(/^\[|\]$/g, '');
    var isLocal = hostname === '127.0.0.1' || hostname === 'localhost' || hostname === '::1';
    var isApprovedProductionHost = hostname === 'kevinsolo.cn'
      || hostname === 'www.kevinsolo.cn'
      || hostname === 'kevin-solo-os.pages.dev'
      || hostname.endsWith('.kevin-solo-os.pages.dev');
    return isApprovedProductionHost
      || (isLocal && /(?:^|[?&])localV3=1(?:&|$)/.test(String(value.search || '')));
  }

  var V3_ADMIN_ENABLED = isV3AdminEnabled(window.location);
  var V3_REVIEW_UI = window.AssessmentV3AdminReview || null;
  var v3ReviewSessionId = '';
  var BASE = window.location.origin;
  var API_BASE = ((window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' || window.location.hostname === '::1' || window.location.hostname === '[::1]') && window.location.port === '8765')
    ? 'http://127.0.0.1:8788'
    : window.location.origin;
  var allData = [];
  var searchAnalytics = null;

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function jsArg(value) {
    return JSON.stringify(String(value == null ? '' : value))
      .replace(/</g, '\\u003c')
      .replace(/>/g, '\\u003e')
      .replace(/&/g, '\\u0026')
      .replace(/"/g, '&quot;');
  }

  function showPageError(message) {
    var safe = escapeHtml(message || '后台加载异常');
    var loginView = document.getElementById('loginView');
    var dashView = document.getElementById('dashView');
    var loadingMsg = document.getElementById('loadingMsg');
    var tableBody = document.getElementById('tableBody');
    if (loginView) loginView.style.display = 'none';
    if (dashView) dashView.style.display = 'block';
    if (loadingMsg) loadingMsg.style.display = 'none';
    if (tableBody) {
      tableBody.innerHTML = '<tr><td colspan="2" style="text-align:center;color:var(--red);padding:32px;">后台加载失败：' + safe + '<br><button class="btn-sm btn-view" style="margin-top:12px;" onclick="localStorage.removeItem(&quot;kevin_admin_pwd&quot;);location.reload();">清除登录状态并重试</button></td></tr>';
    }
  }

  window.addEventListener('error', function(e) {
    showPageError(e.message || '页面脚本错误');
  });
  window.addEventListener('unhandledrejection', function(e) {
    showPageError((e.reason && e.reason.message) || String(e.reason || '异步加载错误'));
  });

  function getPwd() { return localStorage.getItem('kevin_admin_pwd'); }
  function setPwd(v) { localStorage.setItem('kevin_admin_pwd', v); }
  function adminHeaders(extra) {
    var headers = Object.assign({}, extra || {});
    headers['x-admin-password'] = getPwd() || '';
    return headers;
  }
  function adminFetch(url, options) {
    var init = Object.assign({}, options || {});
    init.headers = adminHeaders(init.headers);
    return fetch(url, init);
  }

  function login() {
    var pwd = document.getElementById('pwdInput').value.trim();
    if (!pwd) return;
    setPwd(pwd);
    loadData();
  }

  async function loadData() {
    var pwd = getPwd();
    if (!pwd) {
      showLogin();
      return;
    }

    showDash();
    document.getElementById('loadingMsg').style.display = 'block';
    document.getElementById('tableBody').innerHTML = '';
    document.getElementById('emptyMsg').style.display = 'none';

    try {
      var res = await adminFetch(API_BASE + '/api/getQuizzes?showDeleted=1');
      if (res.status === 401) {
        localStorage.removeItem('kevin_admin_pwd');
        showLogin();
        document.getElementById('loginErr').style.display = 'block';
        document.getElementById('loginErr').textContent = '密码错误，请重新输入';
        return;
      }
      var json = await res.json();
      if (json.error) throw new Error(json.error);

      allData = (json.data || []).slice();
      renderStats();
      filterTable();
      await loadSearchAnalytics(pwd);
      document.getElementById('updateTime').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
    } catch (e) {
      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="2" style="text-align:center;color:var(--red);">加载失败: ' + e.message + '</td></tr>';
    }
    document.getElementById('loadingMsg').style.display = 'none';
  }

  async function loadSearchAnalytics(pwd) {
    try {
      var res = await adminFetch(API_BASE + '/api/track?days=30');
      if (!res.ok) throw new Error('搜索数据暂时不可用');
      var json = await res.json();
      if (json.error) throw new Error(json.error);
      searchAnalytics = json;
      renderSearchInsights(json);
    } catch (e) {
      var el = document.getElementById('searchInsights');
      if (el) el.innerHTML = '<div class="search-insight-card" style="grid-column:1/-1;"><h2>搜索与来源</h2><p style="margin:0;">暂时无法读取搜索数据，不影响客户测评记录。</p></div>';
    }
  }

  function sourceName(value) {
    var labels = {
      direct: '直接访问',
      organic_baidu: '百度自然搜索',
      organic_google: 'Google 自然搜索',
      organic_bing: 'Bing 自然搜索',
      organic_sogou: '搜狗自然搜索',
      organic_360: '360 自然搜索',
      referral_zhihu: '知乎',
      referral_wechat: '微信',
      referral_xiaohongshu: '小红书',
      referral_toutiao: '头条'
    };
    return labels[value] || String(value || '其他来源').replace(/^referral_/, '外部：');
  }

  function funnelSessions(data, eventName) {
    var rows = (data && data.funnel) || [];
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].event_type === eventName) return Number(rows[i].sessions || rows[i].events || 0);
    }
    return 0;
  }

  function rankHtml(rows, labelKey, valueKey, formatter) {
    rows = (rows || []).slice(0, 5);
    if (!rows.length) return '<div class="search-rank"><span>暂无数据</span></div>';
    var html = '<div class="search-rank">';
    for (var i = 0; i < rows.length; i++) {
      var label = formatter ? formatter(rows[i][labelKey]) : rows[i][labelKey];
      html += '<div><span title="' + escapeHtml(label) + '">' + escapeHtml(label) + '</span><strong>' + Number(rows[i][valueKey] || 0) + '</strong></div>';
    }
    return html + '</div>';
  }

  function renderSearchInsights(data) {
    var el = document.getElementById('searchInsights');
    if (!el) return;
    var sources = data.sources || [];
    var organicSessions = 0;
    for (var i = 0; i < sources.length; i++) {
      if (String(sources[i].source || '').indexOf('organic_') === 0) organicSessions += Number(sources[i].sessions || 0);
    }
    var videoOpens = funnelSessions(data, 'open_video_app');
    var quizStarts = funnelSessions(data, 'start_quiz') || funnelSessions(data, 'click_quiz');
    var html = '<section class="search-insight-card"><h2>搜索与来源</h2><p>最近 30 天，按独立浏览会话统计</p><div class="search-kpis">';
    html += '<div class="search-kpi"><strong>' + Number(data.unique_sessions || 0) + '</strong><span>全部会话</span></div>';
    html += '<div class="search-kpi"><strong>' + organicSessions + '</strong><span>自然搜索会话</span></div>';
    html += '<div class="search-kpi"><strong>' + videoOpens + '</strong><span>视频工具打开</span></div>';
    html += '</div></section>';
    html += '<section class="search-insight-card"><h2>访客从哪里来</h2><p>来源会话数，不等于成交数</p>' + rankHtml(sources, 'source', 'sessions', sourceName) + '</section>';
    html += '<section class="search-insight-card"><h2>先落到哪一页</h2><p>入口页会话数 · 测评动作 ' + quizStarts + '</p>' + rankHtml(data.landings || [], 'landing_page', 'sessions') + '</section>';
    el.innerHTML = html;
  }

  function renderStats() {
    var total = allData.length;
    var aCount = 0;
    var bCount = 0;
    var cCount = 0;
    var rCount = 0;
    var paidCount = 0;
    var signalCount = 0;
    var copyWechatCount = 0;
    var click699Count = 0;
    var highPriorityCount = 0;
    for (var i = 0; i < allData.length; i++) {
      var r = allData[i];
      if (r.version === 'A') aCount++;
      if (r.version === 'B') bCount++;
      if (r.version === 'C') cCount++;
      if (r.version === 'report') rCount++;
      if (r.paid) paidCount++;
      if (hasEvent(r, 'click_699_cta') || hasEvent(r, 'copy_wechat_report') || hasEvent(r, 'copy_wechat')) signalCount++;
      if (hasEvent(r, 'copy_wechat_report') || hasEvent(r, 'copy_wechat')) copyWechatCount++;
      if (hasEvent(r, 'click_699_cta')) click699Count++;
      if (getLeadPriority(r).level === 'high') highPriorityCount++;
    }

    var knowledgeCount = 0, promptsCount = 0, consultCount = 0, extractionCount = 0;
    for (var i = 0; i < allData.length; i++) {
      var p = [];
      try { p = JSON.parse(allData[i].purchases || '[]'); } catch(e) { p = []; }
      if (p.indexOf('knowledge99') !== -1) knowledgeCount++;
      if (p.indexOf('prompts99') !== -1) promptsCount++;
      if (p.indexOf('consult699') !== -1) consultCount++;
      if (p.indexOf('extraction') !== -1) extractionCount++;
    }

    var html = '';
    var deepRate = total ? Math.round((rCount / total) * 100) : 0;
    html += '<div class="stat-card"><div class="num">' + total + '</div><div class="label">总测评记录</div></div>';
    html += '<div class="stat-card stat-r"><div class="num">' + rCount + '</div><div class="label">已完成深度报告</div></div>';
    html += '<div class="stat-card"><div class="num">' + deepRate + '%</div><div class="label">深度完成率</div></div>';
    html += '<div class="stat-card"><div class="num" style="color:var(--red);">' + highPriorityCount + '</div><div class="label">高优先跟进</div></div>';
    html += '<div class="stat-card"><div class="num" style="color:var(--red);">' + signalCount + '</div><div class="label">咨询信号</div></div>';
    html += '<div class="stat-card"><div class="num" style="color:var(--red);">' + copyWechatCount + '</div><div class="label">复制微信</div></div>';
    html += '<div class="stat-card stat-boot"><div class="num">' + click699Count + '</div><div class="label">点击职业经验资产一对一诊断入口</div></div>';
    html += '<div class="stat-card"><div class="num" style="color:var(--green);">' + paidCount + '</div><div class="label">已付费客户</div></div>';
    html += '<div class="stat-card stat-pos"><div class="num">' + knowledgeCount + '</div><div class="label">一人公司海外源头库</div></div>';
    html += '<div class="stat-card stat-acq"><div class="num">' + promptsCount + '</div><div class="label">做图提示词库</div></div>';
    html += '<div class="stat-card stat-boot"><div class="num">' + consultCount + '</div><div class="label">已标记职业经验资产一对一诊断成交</div></div>';
    html += '<div class="stat-card"><div class="num" style="color:var(--green);">' + extractionCount + '</div><div class="label">长期萃取</div></div>';

    // Source distribution
    var sourceStats = {};
    for (var i = 0; i < allData.length; i++) {
      var s = (allData[i].source || '').trim();
      if (s) sourceStats[s] = (sourceStats[s] || 0) + 1;
    }
    var sourceKeys = Object.keys(sourceStats).sort(function(a,b){ return sourceStats[b] - sourceStats[a]; });
    for (var k = 0; k < sourceKeys.length; k++) {
      html += '<div class="stat-card"><div class="num" style="color:var(--accent-dark);">' + sourceStats[sourceKeys[k]] + '</div><div class="label">来源: ' + escapeHtml(sourceKeys[k]) + '</div></div>';
    }

    document.getElementById('statsRow').innerHTML = html;
    renderFunnel({
      total: total,
      deep: rCount,
      copyWechat: copyWechatCount,
      click699: click699Count,
      consultDeal: consultCount
    });
    renderOpsBoard();
  }

  function isTodayItem(item) {
    if (!item || !item.created_at) return false;
    var d = new Date(item.created_at);
    var now = new Date();
    return d.getFullYear() === now.getFullYear() &&
      d.getMonth() === now.getMonth() &&
      d.getDate() === now.getDate();
  }

  function parsePurchases(item) {
    try { return JSON.parse((item && item.purchases) || '[]') || []; } catch(e) { return []; }
  }

  function hasDeepCompleted(item) {
    var deepPart = getDeepPart(item);
    return !!(item && (item.version === 'report' || Object.keys(deepPart).length > 0 || hasEvent(item, 'complete_deep_report')));
  }

  function matchesOpsKind(item, kind) {
    if (kind === 'today') return isTodayItem(item);
    if (kind === 'copy_unpaid') return !item.paid && (hasEvent(item, 'copy_wechat_report') || hasEvent(item, 'copy_wechat'));
    if (kind === 'paid_delivery') return !!item.paid;
    if (kind === 'high_699') return getLeadPriority(item).level === 'high' && (hasEvent(item, 'click_699_cta') || getStoredDiagnostic(item).recommend699 || getCommercialSignal(item).score >= 35 || parsePurchases(item).indexOf('consult699') !== -1);
    if (kind === 'deep_unfinished') return hasEvent(item, 'start_deep_report') && !hasDeepCompleted(item);
    return false;
  }

  function renderOpsBoard() {
    var el = document.getElementById('opsBoard');
    if (!el) return;
    var cards = [
      { kind: 'today', title: '今日新增报告', note: '当天新增的测评和报告，先确认是否有高意向。' },
      { kind: 'copy_unpaid', title: '复制微信未付费', note: '已经有私聊动作，但还没有标记付款。' },
      { kind: 'paid_delivery', title: '已付费待交付', note: '需要优先核对付款、报告编号和报告链接。' },
      { kind: 'high_699', title: '职业经验资产一对一诊断高优先', note: '有咨询、服务样例或付费信号，适合人工判断。' },
      { kind: 'deep_unfinished', title: '深度报告未完成', note: '提醒先补完免费测评摘要，再判断个人经验完整路径报告或职业经验资产一对一诊断。' }
    ];
    var html = '';
    for (var i = 0; i < cards.length; i++) {
      var count = allData.filter(function(item) { return matchesOpsKind(item, cards[i].kind); }).length;
      html += '<div class="ops-card"><button onclick="applyOpsFilter(' + jsArg(cards[i].title) + ')">';
      html += '<span class="ops-num">' + count + '</span>';
      html += '<span class="ops-title">' + escapeHtml(cards[i].title) + '</span>';
      html += '<span class="ops-note">' + escapeHtml(cards[i].note) + '</span>';
      html += '</button></div>';
    }
    el.innerHTML = html;
  }

  function applyOpsFilter(label) {
    var input = document.getElementById('searchInput');
    if (!input) return;
    input.value = label;
    filterTable();
  }

  function pct(value, total) {
    if (!total) return 0;
    return Math.max(0, Math.min(100, Math.round((value / total) * 100)));
  }

  function funnelAdvice(data) {
    var total = data.total || 0;
    if (!total) return '还没有足够数据。先发给目标用户测试，看第一批人卡在哪一步。';
    var deepRate = pct(data.deep, total);
    var copyRate = pct(data.copyWechat, total);
    var clickRate = pct(data.click699, total);
    if (deepRate < 35) return '深度完成率偏低，优先看 8 题结果页和深度表单入口是否足够明显。';
    if (copyRate < 20) return '复制微信偏低，优先看个人经验完整路径报告领取区是否让人愿意发送报告编号。';
    if (clickRate < 8) return '职业经验资产一对一诊断入口点击率偏低，说明用户愿意看报告，但预约理由还可以继续打磨。';
    return '漏斗已经有咨询动作，优先跟进高优先客户，记录是否成交。';
  }

  function renderFunnel(data) {
    var el = document.getElementById('funnelCard');
    if (!el) return;
    var total = data.total || 0;
    var steps = [
      { label: '总测评记录', value: data.total || 0, rate: 100 },
      { label: '完成深度报告', value: data.deep || 0, rate: pct(data.deep || 0, total) },
      { label: '复制微信', value: data.copyWechat || 0, rate: pct(data.copyWechat || 0, total) },
      { label: '点击职业经验资产一对一诊断入口', value: data.click699 || 0, rate: pct(data.click699 || 0, total) },
      { label: '已标记职业经验资产一对一诊断成交', value: data.consultDeal || 0, rate: pct(data.consultDeal || 0, total) }
    ];

    var paidDiagnostic = getPaidDiagnostic(item);
    if (paidDiagnostic.nextMessage) return paidDiagnostic.nextMessage;
    if (hasEvent(item, 'click_699_cta')) {
      return '我看到你已经完成深度测评，也点过职业经验资产一对一诊断入口。你现在最卡的是方向、案例、定价还是交付？如果你愿意，我可以先判断一下你是否适合预约职业经验资产一对一诊断。';
    }
    if (hasEvent(item, 'copy_wechat_report') || hasEvent(item, 'copy_wechat')) {
      return '我看到你已经完成深度测评，也复制过微信号。你现在最卡的是方向、案例、定价还是交付？你先说一个最卡的问题，我判断一下是否适合预约职业经验资产一对一诊断。';

  function filterTable() {
    var q = (document.getElementById('searchInput').value || '').trim();
    var data = allData.slice();
    if (q) {
      var lower = q.toLowerCase();
      data = allData.filter(function(r) {
        if (lower.indexOf('今日') !== -1 && !isTodayItem(r)) return false;
        if (lower.indexOf('复制微信未付费') !== -1) return matchesOpsKind(r, 'copy_unpaid');
        if (lower.indexOf('已付费待交付') !== -1) return matchesOpsKind(r, 'paid_delivery');
        if (lower.indexOf('高优先级') !== -1 || lower.indexOf('699') !== -1) {
          if (!matchesOpsKind(r, 'high_699') && parsePurchases(r).indexOf('consult699') === -1 && !hasEvent(r, 'click_699_cta')) return false;
        }
        if (lower.indexOf('深度报告未完成') !== -1) return matchesOpsKind(r, 'deep_unfinished');
        var typeName = TYPE_NAMES[r.result_type] || r.result_type || '';
        var purchases = parsePurchases(r);
        var signalText = getFollowSignals(r).map(function(s) { return s.text; }).join(' ');
        var diagnostic = getStoredDiagnostic(r);
        var paidDiagnostic = getPaidDiagnostic(r);
        var haystack = [
          r.session_id, getMeasurementCode(r), r.wechat, r.nickname, r.source, r.tags, r.notes,
          typeName, r.result_type, r.version, r.paid ? '已付费 付费' : '未付费',
          purchases.join(' '), signalText, getCommercialSignal(r).labels.join(' '),
          diagnostic.label, diagnostic.status, diagnostic.recommend99 ? '推荐个人经验完整路径报告 推荐99报告' : '', diagnostic.recommend699 ? '推荐职业经验资产一对一诊断' : '',
          paidDiagnostic.bucket, paidDiagnostic.leadBucket, paidDiagnostic.diagnosticStatus, getPaidDiagnosticBucketLabel(paidDiagnostic.bucket), paidDiagnostic.priority, paidDiagnostic.firstPath,
          paidDiagnostic.confidence, paidDiagnostic.confidenceLabel, paidDiagnostic.biggestMisjudgment,
          JSON.stringify(paidDiagnostic.informationGaps || []), JSON.stringify(paidDiagnostic.disqualificationRulesHit || []),
          paidDiagnostic.nextMessage, paidDiagnostic.recommendSelfStudy99 ? '99自学 99 自学' : '',
          paidDiagnostic.recommendPrompt99 ? '99提示词 99 提示词' : '',
          paidDiagnostic.recommend99 ? '个人经验完整路径报告 个人经验完整路径报告 99报告 99 报告' : '',
          paidDiagnostic.recommend699 ? '职业经验资产一对一诊断 职业经验资产一对一诊断' : '',
          String(r.result_score || '')
        ].join(' ').toLowerCase();
        return haystack.indexOf(lower) !== -1;
      });
    }
    updateSearchMode(q, data.length);
    data.sort(getSortComparator());
    renderTable(data);
  }

  async function createSecureReportUrl(sid) {
    var res = await adminFetch(API_BASE + '/api/createReportShareLink', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sid })
    });
    var json = await res.json();
    if (!res.ok || !json.url) throw new Error(json.error || '无法生成安全链接');
    return BASE + json.url;
  }

  async function copyReport(sid) {
    try {
      var url = await createSecureReportUrl(sid);
      await navigator.clipboard.writeText(url);
      showToast('赠送链接已复制，客户无需付款即可查看');
    } catch (e) {
      showToast('生成失败：' + e.message);
    }
  }

  function copyFollowMessage(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showToast('跟进话术已复制');
      }).catch(function() {
        showToast(text);
      });
    } else {
      showToast(text);
    }
  }

  function openReport(sid) {
    try {
      sessionStorage.setItem('_kevin_report_admin_pwd', getPwd() || '');
      sessionStorage.setItem('_kevin_report_admin_sid', sid);
      window.open(BASE + '/report/?sid=' + encodeURIComponent(sid), '_blank');
    } catch (e) {
      showToast('打开失败：' + e.message);
    }
  }

  var _pendingDelete = {}; // sid -> timeoutId

  function deleteRow(sid) {
    if (!confirm('确定要删除这条记录吗？')) return;

    // Mark as pending ， grey out and show undo
    var row = document.querySelector('tr[data-sid="' + sid + '"]');
    if (row) row.classList.add('row-deleting');
    // Replace delete button with undo
    var delBtn = document.querySelector('.btn-undo-tgt[data-sid="' + sid + '"]');
    if (delBtn) {
      delBtn.textContent = '撤销';
      delBtn.className = 'btn-sm btn-undo btn-undo-tgt';
      delBtn.onclick = function() { undoDelete(sid); };
    }

    showToast('已删除 · 3秒内可撤销');
    _pendingDelete[sid] = setTimeout(function() {
      executeDelete(sid);
    }, 3000);
  }

  function undoDelete(sid) {
    clearTimeout(_pendingDelete[sid]);
    delete _pendingDelete[sid];

    var row = document.querySelector('tr[data-sid="' + sid + '"]');
    if (row) row.classList.remove('row-deleting');
    var undoBtn = document.querySelector('.btn-undo-tgt[data-sid="' + sid + '"]');
    if (undoBtn) {
      undoBtn.textContent = '删除';
      undoBtn.className = 'btn-sm btn-del btn-undo-tgt';
      undoBtn.onclick = function() { deleteRow(sid); };
    }
    showToast('已撤销删除');
  }

  async function executeDelete(sid) {
    var pwd = getPwd();

      var res = await adminFetch(API_BASE + '/api/deleteQuiz', {
        method: 'POST',

        body: JSON.stringify({ sid: sid })
      });
      var json = await res.json();
      if (json.error) {
        showToast('删除失败: ' + json.error);

      showToast('网络错误: ' + e.message);

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(function() { t.classList.remove('show'); }, 2000);

  function v3Text(value, fallback) {
    if (typeof value === 'string' || typeof value === 'number') return String(value);
    return fallback || '';
  }

  function v3FieldLabel(field) {
    if (V3_REVIEW_UI && typeof V3_REVIEW_UI.fieldLabel === 'function') {
      return V3_REVIEW_UI.fieldLabel(field);
    }
    return '补充信息';
  }

  function v3StatusLabel(status) {
    if (V3_REVIEW_UI && typeof V3_REVIEW_UI.statusLabel === 'function') {
      return V3_REVIEW_UI.statusLabel(status);
    }
    return '状态待确认';
  }

  function v3ChainState(item) {
    var status = item && item.v3_status || '';
    if (!status) return { kind: 'none', label: '尚未进入个性化分析' };
    if (status === 'analyzing' || status === 'not_started') {
      return { kind: 'working', label: '个性化分析中' };
    }
    if (status === 'needs_follow_up') {
      return { kind: 'working', label: '个性化分析待补充' };
    }
    if (['limited', 'ready', 'review_required', 'approved', 'rejected'].indexOf(status) !== -1) {
      return { kind: 'ready', label: '个性化分析已生成' };
    }
    return { kind: 'error', label: '个性化分析失败' };
  }

  function renderV3ChainStatus(item) {
    var state = v3ChainState(item);
    var detail = [];
    if (item && item.v3_stage) detail.push('阶段：' + item.v3_stage);
    if (item && item.v3_provider) detail.push('服务：' + item.v3_provider);
    if (item && item.v3_model) detail.push('模型：' + item.v3_model);
    if (item && item.v3_error_code) detail.push('错误：' + item.v3_error_code);
    if (item && item.v3_updated_at) detail.push('更新：' + item.v3_updated_at);
    return '<span class="v3-chain-status v3-chain-' + escapeHtml(state.kind) + '"' +
      (detail.length ? ' title="' + escapeHtml(detail.join('；')) + '"' : '') +
      '>' + escapeHtml(state.label) + '</span>';
  }

  function v3ConfidenceLabel(value) {
    if (typeof value === 'number') {
      if (value >= 0.8) return '较高';
      if (value >= 0.55) return '中等';
      return '较低';
    }
    return ({ high: '较高', medium: '中等', low: '较低' })[value] || v3Text(value, '未标注');
  }

  function v3PathStatusLabel(value) {
    if (V3_REVIEW_UI && typeof V3_REVIEW_UI.pathStatusLabel === 'function') {
      return V3_REVIEW_UI.pathStatusLabel(value);
    }
    return '待判断';
  }

  function v3ReasonLabel(value) {
    if (V3_REVIEW_UI && typeof V3_REVIEW_UI.reasonLabel === 'function') {
      return V3_REVIEW_UI.reasonLabel(value);
    }
    return '系统发现一项需要人工核对的问题';
  }

  function v3List(values, formatter) {
    if (!Array.isArray(values) || !values.length) return '<div class="q-na">暂无</div>';
    var html = '<ul style="padding-left:20px;margin:8px 0;">';
    for (var i = 0; i < values.length; i++) {
      var value = formatter ? formatter(values[i], i) : v3Text(values[i] && values[i].text, v3Text(values[i]));
      html += '<li>' + escapeHtml(value) + '</li>';
    }
    return html + '</ul>';
  }

  function v3Line(label, value) {
    var text = v3Text(value, '未提供');
    return '<div class="q-answer-detail" style="margin:7px 0;line-height:1.65;"><strong>' +
      escapeHtml(label) + '：</strong>' + escapeHtml(text) + '</div>';
  }

  function v3ReportHtml(report) {
    if (!report || typeof report !== 'object') return '<div class="q-na">AI 报告尚未生成。</div>';
    var html = '';
    var facts = Array.isArray(report.understoodFacts) ? report.understoodFacts : [];
    if (facts.length) {
      html += '<div class="q-answer"><strong>AI 理解到的事实</strong></div>';
      html += v3List(facts, function(item) { return v3Text(item && item.text, v3Text(item)); });
    }
    var judgement = report.primaryJudgement && typeof report.primaryJudgement === 'object' ? report.primaryJudgement : {};
    html += '<div class="q-answer" style="margin-top:12px;"><strong>核心判断</strong></div>';
    html += v3Line('判断', judgement.text || judgement.statement);
    html += v3Line('可信程度', v3ConfidenceLabel(judgement.confidence));
    if (Array.isArray(judgement.limitations) && judgement.limitations.length) {
      html += '<div class="q-answer-detail"><strong>判断限制</strong>' + v3List(judgement.limitations) + '</div>';
    }
    var paths = Array.isArray(report.pathComparison) ? report.pathComparison : [];
    if (paths.length) {
      html += '<div class="q-answer" style="margin-top:14px;"><strong>路径比较</strong></div>';
      for (var p = 0; p < paths.length; p++) {
        html += '<div style="border:1px solid rgba(85,98,79,.18);border-radius:8px;padding:10px 12px;margin-top:8px;">' +
          '<strong>' + escapeHtml(paths[p].path || ('路径 ' + (p + 1))) + '</strong>' +
          '<span style="margin-left:8px;color:var(--muted);">' + escapeHtml(v3PathStatusLabel(paths[p].status)) + '</span>' +
          '<div class="q-answer-detail" style="margin-top:5px;">' + escapeHtml(paths[p].reason || '暂无说明') + '</div></div>';
      }
    }
    var actions = Array.isArray(report.sevenDayAction) ? report.sevenDayAction : [];
    if (actions.length) {
      html += '<div class="q-answer" style="margin-top:14px;"><strong>7 天行动</strong></div>';
      for (var a = 0; a < actions.length; a++) {
        html += '<div style="border-left:3px solid #b78945;padding:3px 0 3px 12px;margin-top:10px;">' +
          '<strong>' + escapeHtml(actions[a].dayRange || ('行动 ' + (a + 1))) + '</strong>' +
          '<div class="q-answer-detail">' + escapeHtml(actions[a].action || '') + '</div>' +
          (actions[a].successSignal ? '<div class="q-answer-detail"><strong>完成信号：</strong>' + escapeHtml(actions[a].successSignal) + '</div>' : '') + '</div>';
      }
    }
    var doNotDo = Array.isArray(report.doNotDo) ? report.doNotDo : [];
    if (doNotDo.length) {
      html += '<div class="q-answer" style="margin-top:14px;"><strong>暂时不要做</strong></div>';
      html += v3List(doNotDo, function(item) { return v3Text(item && item.text, v3Text(item)); });
    }
    if (Array.isArray(report.uncertainty) && report.uncertainty.length) {
      html += '<div class="q-answer" style="margin-top:14px;"><strong>仍不能确定的部分</strong></div>' + v3List(report.uncertainty);
    }
    return html;
  }

  function v3Block(title, body) {
    return '<div class="q-block"><div class="q-title">' + escapeHtml(title) + '</div>' + body + '</div>';
  }

  function v3BuildReviewGuidance(data) {
    if (V3_REVIEW_UI && typeof V3_REVIEW_UI.buildReviewGuidance === 'function') {
      return V3_REVIEW_UI.buildReviewGuidance(data);
    }
    return {
      level: 'medium',
      recommendation: '重点核对后决定',
      summary: '自动复核建议暂时不可用，请只核对核心判断和证据边界。',
      checks: [{
        title: '核心判断与证据',
        standard: '确认结论能在客户原回答中找到依据，没有把推测写成事实。'
      }]
    };
  }

  function v3ReviewGuidanceHtml(guidance) {
    var value = guidance || {};
    var checks = Array.isArray(value.checks) ? value.checks : [];
    var html = '<div class="v3-review-guidance" data-level="' + escapeHtml(value.level || 'medium') + '">';
    html += '<span class="v3-review-recommendation">系统建议：' + escapeHtml(value.recommendation || '重点核对后决定') + '</span>';
    html += '<div class="q-answer-detail" style="margin-top:9px;color:var(--text);">' + escapeHtml(value.summary || '') + '</div>';
    html += '<ol class="v3-review-checks">';
    for (var i = 0; i < checks.length; i++) {
      html += '<li><strong>' + String(i + 1) + '. ' + escapeHtml(checks[i].title || '需要核对') + '</strong>' +
        '<span>通过标准：' + escapeHtml(checks[i].standard || '确认与客户原回答一致。') + '</span></li>';
    }
    return html + '</ol></div>';
  }

  function v3ReviewActionHtml(guidance) {
    var value = guidance || {};
    var approveLabel = value.level === 'low' ? '按系统建议标记通过' : '核对后标记通过';
    var adjustLabel = value.level === 'high' ? '按系统建议标记需要调整' : '标记需要调整';
    return '<div class="q-block">' +
      '<label class="q-title" for="v3ReviewNote">复核备注（仅在发现问题时填写）</label>' +
      '<textarea id="v3ReviewNote" rows="3" style="width:100%;padding:10px;font:inherit;" placeholder="例如：核心判断没有证据；或第 2 条行动需要改成先验证"></textarea>' +
      '<div class="q-answer-detail" style="margin-top:8px;">先按上面的清单核对，不需要逐字通读。此操作只记录你的判断，不会自动修改客户已经看到的报告。</div>' +
      '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">' +
      '<button type="button" class="btn-sm btn-v3" data-v3-review-action onclick="submitV3Review(\'approve\')">' + escapeHtml(approveLabel) + '</button>' +
      '<button type="button" class="btn-sm btn-del" data-v3-review-action onclick="submitV3Review(\'reject\')">' + escapeHtml(adjustLabel) + '</button>' +
      '</div></div>';
  }

  function renderV3Review(data) {
    var redacted = data && data.redacted_input && typeof data.redacted_input === 'object' ? data.redacted_input : {};
    var core = redacted.coreAnswers && typeof redacted.coreAnswers === 'object' ? redacted.coreAnswers : {};
    var followUpAnswers = redacted.followUpAnswers && typeof redacted.followUpAnswers === 'object' ? redacted.followUpAnswers : {};
    var evidence = data && data.evidence && typeof data.evidence === 'object' ? data.evidence : {};
    var accepted = Array.isArray(evidence.accepted) ? evidence.accepted : [];
    var rejected = Array.isArray(evidence.rejected) ? evidence.rejected : [];
    var rules = data && data.kevin_rule_result && typeof data.kevin_rule_result === 'object' ? data.kevin_rule_result : {};
    var caseExtraction = data && data.case_extraction && typeof data.case_extraction === 'object' ? data.case_extraction : null;
    var caseCard = data && data.case_evidence_card && typeof data.case_evidence_card === 'object' ? data.case_evidence_card : null;
    var guidance = v3BuildReviewGuidance(data);
    var html = '<h2>个性化报告复核</h2>';
    html += '<p class="sub" style="line-height:1.7;">系统已先完成证据、边界和质量检查。你只需要处理下面列出的重点，不需要逐字通读整份报告。</p>';
    html += v3ReviewGuidanceHtml(guidance);
    html += v3Block('当前检查状态', '<div class="q-answer"><strong>' + escapeHtml(v3StatusLabel(data && data.status)) + '</strong></div><div class="q-answer-detail">生成：' + escapeHtml(data && data.created_at) + '<br>更新：' + escapeHtml(data && data.updated_at) + '</div>');
    if (data && data.report_candidate) html += v3ReviewActionHtml(guidance);
    html += '<details class="v3-review-details"><summary>需要时展开：客户原话、证据和全部报告内容</summary><div class="v3-review-details-inner">';

    var openAnswerHtml = '';
    ['decision', 'caseOneProblem', 'caseOneAction', 'caseOneResult', 'costSignals'].forEach(function(key) {
      openAnswerHtml += v3Line(v3FieldLabel(key), core[key]);
    });
    Object.keys(followUpAnswers).forEach(function(key) {
      openAnswerHtml += v3Line(v3FieldLabel(key), followUpAnswers[key]);
    });
    html += v3Block('客户真实回答', openAnswerHtml || '<div class="q-na">暂无开放回答</div>');

    var acceptedHtml = accepted.length ? '' : '<div class="q-na">暂无被接受证据</div>';
    for (var i = 0; i < accepted.length; i++) {
      var source = accepted[i] && accepted[i].source && typeof accepted[i].source === 'object' ? accepted[i].source : {};
      var evidenceField = source.field || accepted[i].sourceField || '证据';
      var evidenceQuote = source.quote || accepted[i].sourceQuote || '';
      acceptedHtml += v3Line(v3FieldLabel(evidenceField), evidenceQuote);
    }
    html += v3Block('系统采用的关键证据', acceptedHtml);
    var rejectedHtml = rejected.length
      ? '<div class="q-answer-detail">系统自动排除了 <strong>' + rejected.length + '</strong> 条无法在客户原回答中核验的信息，这些内容不会进入客户报告。通常不需要处理。</div>'
      : '<div class="q-answer-detail">所有采用的信息都能在客户原回答中找到依据。</div>';
    html += v3Block('系统未采用的信息', rejectedHtml);

    if (caseCard) {
      var caseHtml = '<div class="q-answer"><strong>' + escapeHtml(caseCard.title || '未命名案例') + '</strong></div>';
      caseHtml += '<div class="q-answer-detail"><strong>案例状态：</strong>' + escapeHtml(caseExtraction && caseExtraction.complete ? '四项信息已补齐' : '仍有信息待补') + '</div>';
      var caseLabels = {
        context: '发生场景',
        problem: '真实问题',
        goalAndConstraints: '目标与限制',
        alternativesAndJudgement: '选择与判断依据',
        actions: '客户亲自采取的动作',
        result: '实际结果',
        externalSignals: '外部投入与反馈',
        boundaryAndTransfer: '适用与失效边界'
      };
      Object.keys(caseLabels).forEach(function(key) {
        caseHtml += '<div class="q-answer-detail"><strong>' + escapeHtml(caseLabels[key]) + '：</strong>' + escapeHtml(caseCard[key] || '未提供') + '</div>';
      });
      var caseFacts = Array.isArray(caseCard.facts) ? caseCard.facts : [];
      var factsHtml = caseFacts.length ? '' : '<div class="q-na">暂无通过原话核验的事实</div>';
      for (var f = 0; f < caseFacts.length; f++) {
        factsHtml += '<div class="q-answer-detail"><strong>' + escapeHtml(caseFacts[f].evidenceLevel || '证据') + '：</strong>' + escapeHtml(caseFacts[f].sourceQuote || caseFacts[f].claim || '') + '</div>';
      }
      caseHtml += '<div class="q-answer-detail"><strong>已核验事实</strong></div>' + factsHtml;
      caseHtml += '<div class="q-answer-detail"><strong>当前解释：</strong>' + escapeHtml(caseCard.interpretation && caseCard.interpretation.text || '暂无') + '</div>';
      var hypotheses = Array.isArray(caseCard.hypotheses) ? caseCard.hypotheses.map(function(item) { return item && item.text; }).filter(Boolean) : [];
      caseHtml += '<div class="q-answer-detail"><strong>待验证假设</strong>' + v3List(hypotheses) + '</div>';
      caseHtml += '<div class="q-answer-detail"><strong>不能直接推断</strong>' + v3List(caseCard.doNotInfer) + '</div>';
      caseHtml += '<div class="q-answer-detail"><strong>下一步：</strong>' + escapeHtml(caseCard.nextAction || '待人工判断') + '</div>';
      html += v3Block('案例证据卡', caseHtml);
    } else if (caseExtraction && caseExtraction.required) {
      html += v3Block('案例证据卡', '<div class="q-na">案例萃取已触发，客户尚未补齐四项真实回答。</div>');
    }

    var checkHtml = '<div class="q-answer"><strong>信息缺口</strong></div>' + v3List(data && data.missing_information);
    if (Array.isArray(rules.contradictions) && rules.contradictions.length) checkHtml += '<div class="q-answer"><strong>回答中的矛盾</strong></div>' + v3List(rules.contradictions, v3ReasonLabel);
    if (Array.isArray(rules.reviewReasons) && rules.reviewReasons.length) checkHtml += '<div class="q-answer"><strong>需要人工复核的原因</strong></div>' + v3List(rules.reviewReasons, v3ReasonLabel);
    if (Array.isArray(rules.prohibitedConclusions) && rules.prohibitedConclusions.length) checkHtml += '<div class="q-answer"><strong>不能越过的判断边界</strong></div>' + v3List(rules.prohibitedConclusions);
    var qualityResult = data && data.quality_result && typeof data.quality_result === 'object' ? data.quality_result : {};
    var qualityIssues = qualityResult.issues || qualityResult.warnings || qualityResult.personalizationIssues || [];
    if (Array.isArray(qualityIssues) && qualityIssues.length) checkHtml += '<div class="q-answer"><strong>质量检查提示</strong></div>' + v3List(qualityIssues, v3ReasonLabel);
    html += v3Block('需要你重点检查', checkHtml);
    html += v3Block('生成的报告', data && data.report_candidate
      ? v3ReportHtml(data.report_candidate)
      : '<div class="q-na">案例材料已记录，候选报告尚未生成，当前不能批准或驳回。</div>');
    var review = data && data.review_metadata && typeof data.review_metadata === 'object' ? data.review_metadata : {};
    var reviewHtml = review.action ? v3Line('最近结论', review.action === 'approve' ? '复核通过' : '需要调整') : '<div class="q-na">尚未人工复核</div>';
    if (review.note) reviewHtml += v3Line('备注', review.note);
    if (review.reviewed_at) reviewHtml += v3Line('复核时间', review.reviewed_at);
    html += v3Block('复核记录', reviewHtml);
    html += '</div></details>';
    document.getElementById('answersContent').innerHTML = html;
  }

  async function showV3Review(sid) {

    document.getElementById('answersModal').classList.add('show');
    try {
      var pwd = getPwd();
      var url = API_BASE + '/api/getAssessmentV3?sid=' + encodeURIComponent(sid);
      var res = await adminFetch(url);
      var json = await res.json();
      if (res.status === 404) {
        content.innerHTML = '<h2>个性化报告复核</h2><p class="sub">这条记录尚未生成个性化分析报告。</p>';
        return;
      }
      if (!res.ok) throw new Error(json && json.code ? json.code : 'V3 请求失败');
      renderV3Review(json);
    } catch (e) {
      content.innerHTML = '<h2>个性化报告复核</h2><p class="sub">读取失败：' + escapeHtml(e && e.message ? e.message : '请稍后重试') + '</p>';
    }
  }

  async function submitV3Review(action) {
    if (!V3_ADMIN_ENABLED || !v3ReviewSessionId) return;
    var actionLabel = action === 'approve' ? '复核通过' : '需要调整';
    if (!confirm('确认将这份报告标记为“' + actionLabel + '”吗？此操作不会修改客户已经看到的报告。')) return;
    var note = document.getElementById('v3ReviewNote');
    var controls = document.querySelectorAll('[data-v3-review-action]');
    for (var i = 0; i < controls.length; i++) controls[i].disabled = true;
    try {
      var pwd = getPwd();
      var res = await adminFetch(API_BASE + '/api/reviewAssessmentV3', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: v3ReviewSessionId, action: action, note: note ? note.value : '' })
      });
      var json = await res.json();
      if (!res.ok) throw new Error(json && json.code ? json.code : 'V3 复核失败');
      showToast('已标记为' + actionLabel);
      await showV3Review(v3ReviewSessionId);
    } catch (e) {
      showToast('复核失败：' + (e && e.message ? e.message : '请稍后重试'));
      for (var j = 0; j < controls.length; j++) controls[j].disabled = false;
    }
  }

  function showAnswers(sid) {
    var item = null;
    for (var i = 0; i < allData.length; i++) {
      if (allData[i].session_id === sid) { item = allData[i]; break; }
    }
    if (!item) return;

    var answers = normalizeAnswers(item.answers);
    var quizPart = normalizeAnswers(answers.quiz || answers.quick || answers.base || answers);
    var deepPart = getDeepPart(item);
    var typeName = TYPE_NAMES[item.result_type] || item.result_type || '-';
    var html = '<h2>客户答题详情</h2>';
    html += '<p class="sub">测评编号: ' + escapeHtml(getMeasurementCode(item) || '未生成') + ' · 会话ID: ' + escapeHtml(sid) + ' · ';
    html += '结果: <span class="tag tag-paid" style="padding:2px 10px;">' + typeName + '</span> · ';
    html += '匹配度: ' + (item.result_score != null ? item.result_score : '-') + '</p>';
    html += '<div style="margin-bottom:16px;">' + renderSignalTags(item) + '</div>';
    html += renderFollowAdvice(item);
    html += renderLeadSnapshot(item, deepPart);

    // Detect report version: answers = { quiz: {...}, deep: {...} }
    html += '<h3 style="margin-top:18px;margin-bottom:12px;font-size:16px;">8 题快速测评</h3>';

    for (var j = 0; j < QUESTIONS.length; j++) {
      var q = QUESTIONS[j];
      var rawVal = answerValue(quizPart, q, j);
      var val = normalizeOptionKey(rawVal);
      html += '<div class="q-block">';
      html += '<div class="q-num">第 ' + (j + 1) + ' / 8 题</div>';
      html += '<div class="q-title">' + q.title + '</div>';
      if (val && q.options[val]) {
        html += '<span class="q-answer">' + val + '. ' + q.options[val] + '</span>';
      } else if (val) {
        html += '<span class="q-answer">' + val + '</span>';
      } else {
        html += '<span class="q-na">未作答</span>';
      }
      html += '</div>';
    }

    // Show deep form data if report version
    if (deepPart && Object.keys(deepPart).length) {
      html += '<h3 style="margin-top:20px;margin-bottom:12px;font-size:16px;">深度问题</h3>';
      var orderedDeepKeys = ['name','industry','years','status','currentState','caseCount','caseCountDetailed','bestCaseDescription','evidenceQuality','evidenceType','targetCustomerClarity','problemScene','deliverableReadiness','costWillingnessSignal','consultedBefore','paidBefore','paidSignal','deliveryPreference','careerVsProductization','organizationComplexity','consumerAnxiety','deliveryResponsibility','serviceDataReadiness','hours','weeklyHours','hourlyRate','hourlyValue','friends','audience','otherFans','pastTry','attempts','pastResult','bottleneck','biggestBlock','currentOffer','targetUser','availableAssets','expectation','confidence'];
      var rendered = {};
      for (var dki = 0; dki < orderedDeepKeys.length; dki++) {
        var dk = orderedDeepKeys[dki];
        if (deepPart.hasOwnProperty(dk)) {
          html += renderKeyValueBlock(DEEP_LABELS[dk] || v3FieldLabel(dk), deepPart[dk]);
          rendered[dk] = true;
        }
      }
      for (var extraKey in deepPart) {
        if (deepPart.hasOwnProperty(extraKey) && !rendered[extraKey]) {
          html += renderKeyValueBlock(v3FieldLabel(extraKey), deepPart[extraKey]);
        }
      }
    } else if (item.version === 'report') {
      html += '<div class="q-block" style="border-color:rgba(192,57,43,.25);background:rgba(192,57,43,.04);">';
      html += '<div class="q-num">深度问题</div>';
      html += '<div class="q-title" style="font-weight:400;">这条记录被标记为深度报告，但没有读到深度答案。可能是早期记录、保存失败，或接口返回字段不完整。</div>';
      html += '</div>';
    }

    html += renderEventTimeline(item);

    if ((!answers || Object.keys(answers).length === 0) && item.answers) {
      html += renderKeyValueBlock('原始 answers', item.answers);
    }

    document.getElementById('answersContent').innerHTML = html;
    document.getElementById('answersModal').classList.add('show');
  }

  function closeAnswersModal() {
    document.getElementById('answersModal').classList.remove('show');
  }

  // Click outside modal to close
  document.addEventListener('click', function(e) {
    if (e.target.id === 'answersModal') closeAnswersModal();
  });

  
  // ==================== BATCH DELETE ====================
  function toggleSelectAll(cb) {
    var checkboxes = document.querySelectorAll('#tableBody .row-checkbox');
    for (var i = 0; i < checkboxes.length; i++) {
      checkboxes[i].checked = cb.checked;
    }
    updateBatchButtons();
  }

  function updateBatchButtons() {
    var checkboxes = document.querySelectorAll('#tableBody .row-checkbox:checked');
    var count = checkboxes.length;
    var bar = document.getElementById('batchBar');
    document.getElementById('batchCount').textContent = count;
    if (count > 0) {
      bar.classList.add('show');
    } else {
      bar.classList.remove('show');
      document.getElementById('selectAll').checked = false;
    }
  }

  function clearSelection() {
    var checkboxes = document.querySelectorAll('#tableBody .row-checkbox');
    for (var i = 0; i < checkboxes.length; i++) {
      checkboxes[i].checked = false;
    }
    document.getElementById('selectAll').checked = false;
    updateBatchButtons();
  }

  async function batchDelete() {
    var checkboxes = document.querySelectorAll('#tableBody .row-checkbox:checked');
    if (checkboxes.length === 0) return;
    if (!confirm('确定要批量删除已选的 ' + checkboxes.length + ' 条记录吗？')) return;

    var pwd = getPwd();
    var total = checkboxes.length;
    var done = 0;
    var failed = [];

    for (var i = 0; i < checkboxes.length; i++) {
      var sid = checkboxes[i].getAttribute('data-sid');
      try {
        var res = await adminFetch(API_BASE + '/api/deleteQuiz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sid: sid })
        });
        var json = await res.json();
        if (json.error) {
          failed.push(sid);
        } else {
          done++;
          // Remove from local data
          allData = allData.filter(function(r) { return r.session_id !== sid; });
        }
      } catch(e) {
        failed.push(sid);
      }
    }

    clearSelection();
    renderStats();
    filterTable();
    if (failed.length > 0) {
      showToast('成功删除 ' + done + '/' + total + ' 条，失败: ' + failed.join(', '));
    } else {
      showToast('已批量删除 ' + done + ' 条记录');
    }
  }

// Init
  var savedPwd = getPwd();
  if (savedPwd) {
    loadData();
  } else {
    showLogin();
  }
</script>
